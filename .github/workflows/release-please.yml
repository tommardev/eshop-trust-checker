# Pre-1.0 release automation (docs/AUTOMATION_WORKFLOW.md).
# - On push to main (or manual workflow_dispatch): opens or updates the Release PR
#   when releasable feat:/fix: commits exist, and creates the git tag + GitHub Release
#   when a merged Release PR is pushed.
# - Core 1a intentionally pauses autonomous sidecars while a Release PR is open so a
#   human can review and merge it cleanly before the next issue starts.
# - For planned minor waves (e.g. 0.2.0): push an empty commit on main with footer
#   "Release-As: 0.2.0" (the push automatically opens or updates the Release PR).
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      - name: Summarize run
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_STEP_OUTCOME: ${{ steps.release.outcome }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          MODE="${EVENT_NAME} (open/update Release PR + tag/release if applicable)"

          if [ "$RELEASES_CREATED" = "true" ]; then
            RELEASE_STATUS="Created ${TAG_NAME} (${RELEASE_URL})"
          else
            RELEASE_STATUS="None (no newly merged Release PR detected)"
          fi

          if [ "$PRS_CREATED" = "true" ]; then
            PR_NUM=$(printf '%s' "$PR_JSON" | jq -r '.number // empty')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // empty')
            if [ -n "$PR_NUM" ]; then
              PR_STATUS="Opened/updated #${PR_NUM} ${PR_TITLE} (${REPO_URL}/pull/${PR_NUM})"
            else
              PR_STATUS="Opened/updated"
            fi
          else
            PR_STATUS="None (no releasable feat:/fix: commits since last release)"
          fi

          {
            echo "### Release Please Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${EVENT_NAME}\` |"
            echo "| Mode | ${MODE} |"
            echo "| Action outcome | \`${RELEASE_STEP_OUTCOME}\` |"
            echo "| GitHub Release | ${RELEASE_STATUS} |"
            echo "| Release PR | ${PR_STATUS} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
